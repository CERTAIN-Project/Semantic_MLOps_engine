[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "certain-library"
version = "0.1.0"
authors = [
    {name = "Dimitrios Christodoulou", email = "dimitrios.christodoulou@digital4planet.org"},
]
description = "A comprehensive Python library for logging ML experiments to MLflow"
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "pandas>=1.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=22.0.0",
    "flake8>=5.0.0",
    "mypy>=1.0.0",
]

[project.urls]
"Homepage" = "https://github.com/yourusername/certain-library"
"Bug Reports" = "https://github.com/yourusername/certain-library/issues"
"Source" = "https://github.com/yourusername/certain-library"

[tool.setuptools.packages.find]
where = ["."]
include = ["certain_library*"]