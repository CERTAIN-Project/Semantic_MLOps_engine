[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "certain-library"
version = "0.1.0"
authors = [
    {name = "Dimitrios Christodoulou", email = "dimitrios.christodoulou@digital4planet.org"},
]
description = "A comprehensive Python library for logging ML experiments to MLflow"
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dynamic = ["dependencies", "optional-dependencies"]

[project.urls]
"Homepage" = "https://github.com/yourusername/certain-library"
"Bug Reports" = "https://github.com/yourusername/certain-library/issues"
"Source" = "https://github.com/yourusername/certain-library"

[tool.setuptools.packages.find]
where = ["."]
include = ["certain_library*"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}
optional-dependencies.dev = {file = ["requirements-dev.txt"]}

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["Semantic_MLOps_engine"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Import roots the tests need (same as PYTHONPATH=.:certain_library:data_api).
pythonpath = [".", "certain_library", "data_api"]

addopts = "-ra"