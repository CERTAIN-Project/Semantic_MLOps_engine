services:
  postgres:
    image: postgres:13
    container_name: certain_databases
    ports:
      - "5432:5432"
    volumes:
      - ./docker_data/postgres/:/var/lib/postgresql/data
      - ./init_databases.sql:/docker-entrypoint-initdb.d/01_init_databases.sql
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    networks:
      - certain_library_default
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrations:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: certain_migrations
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - certain_library_default
    environment:
      - ALEMBIC_DATABASE_URL=postgresql://postgres:postgres@postgres:5432/certain_db
      - PYTHONPATH=/app:/app/data_api
    working_dir: /app/data_api
    command: >
      sh -c "
      alembic upgrade head
      "
    restart: "no"

  mlflow:
    image: python:3.11-slim
    container_name: certain_mlflow
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "5001:5001"
    volumes:
      - ./docker_data/mlflow_artifacts:/app/mlruns
    environment:
      - MLFLOW_BACKEND_STORE_URI=postgresql://postgres:postgres@postgres:5432/mlflow
      - MLFLOW_DEFAULT_ARTIFACT_ROOT=/app/mlruns
    networks:
      - certain_library_default
    command: >
      sh -c "
      pip install mlflow==2.21.2 psycopg2-binary &&
      mlflow server
      --backend-store-uri postgresql://postgres:postgres@postgres:5432/mlflow
      --default-artifact-root /app/mlruns
      --host 0.0.0.0
      --port 5001
      "
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:5001/')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  data_transfer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: certain_data_transfer_api
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - certain_library_default
    ports:
      - "8001:8001"
    environment:
      - MLFLOW_DB=postgresql://postgres:postgres@postgres:5432/mlflow
      - TARGET_DB=postgresql://postgres:postgres@postgres:5432/certain_db
      - MLFLOW_ARTIFACTS=/app/mlruns
      - MLFLOW_TRACKING_URI=http://certain_mlflow:5001
      - PYTHONPATH=/app:/app/data_api
    volumes:
      - ./docker_data/mlflow_artifacts:/app/mlruns
      - ./test_docker:/app/test_docker
    working_dir: /app/data_api
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8001"]
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8001/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  library_tracker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: certain_library_tracker
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - certain_library_default
    ports:
      - "8002:8002"
    environment:
      - MLFLOW_TRACKING_URI=postgresql+psycopg2://postgres:postgres@postgres:5432/mlflow
      - MLFLOW_DB=postgresql+psycopg2://postgres:postgres@postgres:5432/mlflow
      - MLFLOW_ARTIFACTS=/app/mlruns
      - MLFLOW_ARTIFACT_ROOT=/app/mlruns
      - PYTHONPATH=/app:/app/certain_library
    volumes:
      - ./docker_data/mlflow_artifacts:/app/mlruns
    stdin_open: true
    tty: true

  data_lineage_api:
    build:
      context: .
      dockerfile: data-lineage-api.dockerfile
    container_name: certain_data_lineage_api
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      PGRST_DB_URI: postgresql://postgres:postgres@postgres:5432/certain_db
      PGRST_DB_ANON_ROLE: postgres
    networks:
      - certain_library_default

  # ── Ontop (SPARQL / virtual knowledge graph) ──────────────────────────
  # Downloads the PostgreSQL JDBC driver once, then the ontop service
  # picks it up from a shared volume.
  download_jdbc:
    image: curlimages/curl:latest
    container_name: ontop_download_jdbc
    user: root
    volumes:
      - jdbc_driver:/jdbc
    networks:
      - certain_library_default
    command: >
      sh -c '
        if [ ! -f /jdbc/postgresql-42.7.10.jar ]; then
          echo "Downloading PostgreSQL JDBC driver...";
          curl -L -o /jdbc/postgresql-42.7.10.jar https://jdbc.postgresql.org/download/postgresql-42.7.10.jar;
          echo "JDBC driver downloaded";
        else
          echo "JDBC driver already exists, skipping download";
        fi
      '

  ontop:
    image: ontop/ontop:5.5.0
    container_name: certain_ontop
    depends_on:
      postgres:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
      download_jdbc:
        condition: service_completed_successfully
    networks:
      - certain_library_default
    ports:
      - "0.0.0.0:8080:8080"
    volumes:
      - ./ontop/input:/opt/ontop/input
      - jdbc_driver:/opt/ontop/jdbc
    command: >
      /opt/ontop/ontop endpoint
      --ontology /opt/ontop/input/aidoc-ap.ttl
      --mapping /opt/ontop/input/aidoc-ap_r2rml.ttl
      --properties /opt/ontop/input/aidoc-ap.properties
      --cors-allowed-origins "*"
      --lazy
      --port 8080
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  jdbc_driver:

networks:
  certain_library_default:
    driver: bridge
